spring.datasource.url=jdbc:mysql://localhost:3306/loopsaathi?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.config.import=optional:file:./application-local.properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8080
server.address=127.0.0.1
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# LOOPSAATHI_AI_URL is the complete /classify endpoint, not just the service origin.
loopsaathi.ai-url=${LOOPSAATHI_AI_URL:http://localhost:8000/classify}
